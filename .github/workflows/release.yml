name: Release firmware

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Check out pinned router-platform helpers
        uses: actions/checkout@v7
        with:
          repository: kimiusolover/router-platform
          ref: 841a8af0445b1d1a46558ba1df8435d222e38cd4
          path: router-platform
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check out routerctl release verifier
        uses: actions/checkout@v7
        with:
          repository: kimiusolover/routerctl
          ref: e02171e03891f2a1e65442d27e2163826fc2587d
          path: routerctl
          fetch-depth: 1
      - uses: actions/setup-go@v7
        with:
          go-version-file: routerctl/go.mod
          cache-dependency-path: routerctl/go.sum
      - name: Verify release artifacts
        run: |
          go run ./routerctl/cmd/routerctl verify-release \
            --repo . \
            --tag "${{ inputs.tag }}"
