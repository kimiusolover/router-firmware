name: CI

on:
  push:
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  commit-trailer-policy:
    name: commit-trailer-policy
    runs-on: ubuntu-latest
    # This workflow runs from the protected base branch, not PR code. It only
    # fetches PR Git objects, so a PR cannot weaken its own verifier.
    if: github.event_name == 'pull_request_target'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Check out the pinned trailer verifier
        uses: actions/checkout@v6
        with:
          repository: kimiusolover/routerctl
          ref: f6c6e56bdd2ad06fca8184e8f3a377bf926210a4
          path: routerctl
          fetch-depth: 1
      - uses: actions/setup-go@v7
        with:
          go-version-file: routerctl/go.mod
      - name: Fetch pull request commits without checking out PR code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr-$PR_NUMBER"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
      - name: Verify pull request commit trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          commits="$(git rev-list --reverse "$BASE_SHA..$HEAD_SHA")"
          test -n "$commits" || { echo "No pull request commits to verify."; exit 0; }
          while IFS= read -r commit; do
            echo "Verifying $commit"
            go run ./routerctl/cmd/routerctl verify commit --repo . "$commit"
          done <<< "$commits"

  firmware-metadata-verification:
    name: firmware-metadata-verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify guarded firmware metadata
        run: |
          make verify DEVICE=ax23v-v1
          make verify DEVICE=x86_64-qemu-uefi-preview

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run firmware safety-gate tests
        run: python -m unittest discover -s tests -p 'test_*.py'
