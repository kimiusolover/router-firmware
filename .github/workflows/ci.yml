name: CI

on:
  push:
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  commit-trailer-policy:
    name: commit-trailer-policy
    runs-on: ubuntu-latest
    # This workflow runs from the protected base branch, not PR code. It only
    # fetches PR Git objects, so a PR cannot weaken its own verifier.
    if: github.event_name == 'pull_request_target'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Check out the pinned trailer verifier
        uses: actions/checkout@v6
        with:
          repository: kimiusolover/routerctl
          ref: f6c6e56bdd2ad06fca8184e8f3a377bf926210a4
          path: routerctl
          fetch-depth: 1
      - uses: actions/setup-go@v7
        with:
          go-version-file: routerctl/go.mod
      - name: Fetch pull request commits without checking out PR code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr-$PR_NUMBER"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          # routerctl's verifier deliberately rejects a detached repository.
          # Keep the checked-out base code while attaching it to a runner-local
          # branch for the read-only commit inspection below.
          git switch --force-create trailer-verifier-base "$BASE_SHA"
      - name: Verify pull request commit trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          commits="$(git rev-list --reverse "$BASE_SHA..$HEAD_SHA")"
          test -n "$commits" || { echo "No pull request commits to verify."; exit 0; }
          while IFS= read -r commit; do
            echo "Verifying $commit"
            (
            cd routerctl
            go run ./cmd/routerctl verify commit --repo .. "$commit"
            )
          done <<< "$commits"

  firmware-metadata-verification:
    name: firmware-metadata-verification
    runs-on: ubuntu-latest
    # pull_request_target uses the protected base workflow.  Only the
    # base-owned trailer verifier is safe and useful there; metadata and test
    # jobs run from the PR workflow on the pull_request event below.
    if: github.event_name != 'pull_request_target'
    steps:
      - uses: actions/checkout@v6
      - name: Check out pinned platform metadata
        uses: actions/checkout@v6
        with:
          repository: kimiusolover/router-platform
          ref: 841a8af0445b1d1a46558ba1df8435d222e38cd4
          path: router-platform
      - name: Verify guarded firmware metadata
        env:
          ROUTER_PLATFORM_ROOT: ${{ github.workspace }}/router-platform
        run: make verify DEVICE=ax23v-v1

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request_target'
    steps:
      - uses: actions/checkout@v6
      - name: Check out pinned platform metadata
        uses: actions/checkout@v6
        with:
          repository: kimiusolover/router-platform
          ref: 841a8af0445b1d1a46558ba1df8435d222e38cd4
          path: router-platform
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run firmware safety-gate tests
        env:
          ROUTER_PLATFORM_ROOT: ${{ github.workspace }}/router-platform
        run: python -m unittest discover -s tests -p 'test_*.py'
