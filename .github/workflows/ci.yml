name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-test:
    name: verify-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify guarded firmware metadata
        run: make verify DEVICE=ax23v-v1
      - name: Run safety-gate tests
        run: make test
