name: Build firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out pinned platform metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kimiusolover/router-platform
          ref: 841a8af0445b1d1a46558ba1df8435d222e38cd4
          path: router-platform
      - name: Validate pipeline inputs
        env:
          ROUTER_PLATFORM_ROOT: ${{ github.workspace }}/router-platform
        run: make verify DEVICE=ax23v-v1
      - name: Run repository tests
        env:
          ROUTER_PLATFORM_ROOT: ${{ github.workspace }}/router-platform
        run: make test
      - name: Report guarded target status
        run: |
          echo "ax23v-v1 remains in discovery."
          echo "Firmware assembly starts only after source locks, package recipes,"
          echo "the partition map, and the image layout are independently verified."
