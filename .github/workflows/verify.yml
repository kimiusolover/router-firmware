name: Verify metadata

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify AX23V metadata
        run: make verify DEVICE=ax23v-v1
      - name: Test guarded stages
        run: make test
