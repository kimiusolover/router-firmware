name: Verify metadata

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify AX23V metadata
        run: make verify DEVICE=ax23v-v1
      - name: Test guarded stages
        run: make test
