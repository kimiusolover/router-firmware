# AX23V v1 hardware overlay for the upstream Archer AX23 v1 definition.
#
# This file is descriptive only while device.yaml has status: discovery.  The
# image pipeline intentionally does not consume it to generate a DTS or image.
# Each item is tagged with the evidence level so the eventual generator can
# reject assumptions rather than silently applying them.
schema: router-firmware.hardware-overlay/v1
base_device: tplink-archer-ax23-v1

platform:
  soc: MT7621DAT
  architecture: mipsel
  openwrt_target: ramips/mt7621
  ram_bytes: 134217728
  flash:
    type: spi-nor
    size_bytes: 16777216
  evidence: inherited-upstream-high-confidence

ethernet:
  switch: mt7621
  speed: 1g
  # This is the material AX23V delta.  WAN is a dedicated GMAC connection,
  # not DSA port 0; LAN ports are DSA ports 1 through 4.
  wan:
    type: dedicated-gmac
    gmac: 1
    phy: 0
    mac_source: config:0x8
    mac_increment: 1
  lan1: { type: dsa, port: 1, phy: 1 }
  lan2: { type: dsa, port: 2, phy: 2 }
  lan3: { type: dsa, port: 3, phy: 3 }
  lan4: { type: dsa, port: 4, phy: 4 }
  evidence: third-party-build-and-user-report

factory_image:
  format: tplink-safeloader
  base_board_id: ARCHER-AX23-V1
  image_size_kib: 15744
  support_list_entry:
    product_name: Archer AX23V
    product_version: "1.0"
    special_id: "4A500000"
  evidence: third-party-build-and-user-report

nvmem:
  # Inherited from the AX23 v1 DTS.  Do not read, write, or bundle these
  # regions until an AX23V unit has been inspected and the result recorded.
  base_mac: { partition: config, offset: 0x8, length: 6, status: needs-device-dump }
  radio_eeprom: { partition: radio, offset: 0x0, length: 0xe00, status: needs-device-dump }

wifi:
  driver: mt76
  bus: pcie
  firmware_package: kmod-mt7915-firmware
  radios:
    - { band: 2g, mac_increment: 0, status: needs-device-dump }
    - { band: 5g, mac_increment: -1, dfs: true, status: needs-device-dump }

gpio:
  inherits: tplink-archer-ax23-v1
  status: partially-verified-on-device
  buttons:
    wps:
      gpio: 7
      active_low: true
      irq: true
      physical_label: WPS
      linux_function: rfkill
      hotplug_button: rfkill
      evidence: on-device-hotplug-pressed-and-released
      status: verified
    reset:
      gpio: 8
      active_low: true
      irq: true
      physical_label: Reset
      physical_type: recessed-pinhole
      requires_tool: true
      linux_function: reset
      short_press_action: reboot
      evidence: on-device-ssh-disconnect-and-post-press-uptime
      # The device rebooted before its temporary hotplug log could be read.
      # Do not claim the OpenWrt hotplug button name until it is captured.
      hotplug_button_status: not-directly-observed
      status: verified-physical-control
  platform_gpio:
    pcie_external_reset:
      gpio: 19
      active_low: true
      direction: output
      scope: mt7621-pcie-controller
      status: inherited-soc-definition

boot:
  bootloader: u-boot
  console: ttyS0
  console_baud: 115200
  status: inherited-upstream-needs-device-test

regulatory:
  # special_id is a TP-Link distribution identifier.  It must not be used to
  # derive a regulatory profile.
  profile_required: true
  default_profile: JP
  status: certification-profile-pending
