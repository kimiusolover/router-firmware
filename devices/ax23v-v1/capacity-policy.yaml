# AX23V capacity policy. This has no numeric allocation until the MTD map and
# RAM budget are evidenced. It is therefore a validator input, not a layout.
schema: router-firmware.device-capacity-policy/v1
specification: ../../docs/capacity-allocation-specification.yaml
device: ax23v-v1
status: discovery
capabilities:
  persistent_total_bytes: unset
  os_managed_persistent_bytes: unset
  ram_total_bytes: unset
  verified_preserved_region_boundaries: false

allocations:
  BOOT: { required: true, resource: hardware-owned, min: unset, target: unset, max: unset, reserve: unset, growth: fixed, pressure_behavior: reject-update }
  DEVICE_DATA: { required: true, resource: hardware-owned, min: unset, target: unset, max: unset, reserve: unset, growth: fixed, pressure_behavior: reject-layout }
  SYSTEM: { required: true, resource: persistent, min: unset, target: unset, max: unset, reserve: unset, growth: controlled-by-verified-update-model, pressure_behavior: reject-update-or-rollback }
  CONFIG: { required: true, resource: persistent, min: unset, target: unset, max: unset, reserve: unset, growth: bounded-with-known-good-reserve, pressure_behavior: reject-commit-preserve-known-good }
  STATE: { required: true, resource: persistent, min: unset, target: unset, max: unset, reserve: unset, growth: bounded-per-service, pressure_behavior: compact-or-regenerate-designated-state }
  LOG: { required: false, resource: ram, min: unset, target: unset, max: unset, reserve: unset, growth: quota-and-rotation, pressure_behavior: rotate-then-drop-oldest }
  CACHE: { required: false, resource: ram, min: unset, target: unset, max: unset, reserve: unset, growth: quota-and-eviction, pressure_behavior: evict-then-disable-cache }
  RECOVERY: { required: true, resource: protected-persistent-or-external, min: unset, target: unset, max: unset, reserve: unset, growth: fixed-by-recovery-policy, pressure_behavior: reject-layout }

layout_generation:
  allowed: false
  blocked_by:
    - unverified-mtd-map
    - unverified-preserved-region-boundaries
    - unset-persistent-capacity
    - unset-ram-capacity
    - unset-per-class-allocation-values
