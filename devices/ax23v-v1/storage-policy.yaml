# AX23V v1 logical-storage policy. This is intentionally not a partition map.
# No inferred names, offsets, sizes, or writable slots may be added here.
schema: router-firmware.storage-policy/v1
specification: ../../docs/storage-specification.yaml
device: ax23v-v1
status: discovery
hardware_constraints:
  flash_type: spi-nor
  flash_size_bytes: 16777216
  physical_layout: unverified

classes:
  BOOT:
    placement: existing-dedicated-mtd-candidate
    write_policy: forbidden-until-bootloader-evidence
  DEVICE_DATA:
    placement: existing-vendor-partition-candidate
    candidates: [factory, art, radio, tplink, config, tp-link-reserved]
    write_policy: forbidden
    image_inclusion: forbidden
    migration: forbidden
  SYSTEM:
    placement: undecided
    permitted_after_evidence: [immutable_image, dedicated_partition, subvolume]
  CONFIG:
    placement: undecided
    permitted_after_evidence: [persistent_directory, dedicated_partition, subvolume]
  STATE:
    placement: undecided
    permitted_after_evidence: [persistent_directory, subvolume]
  LOG:
    placement: tmpfs-preferred
    persistent_fallback: quota-limited-storage
  CACHE:
    placement: tmpfs-preferred
    persistent_fallback: disposable-storage
  RECOVERY:
    local_placement: minimal-trusted-metadata-only
    full_image: signed-external-source
    write_policy: forbidden-until-recovery-evidence

evidence_required_before_physical_layout:
  - stock-image-analysis
  - serial-bootloader-partition-listing
  - partition-name-size-offset-and-erase-block-record
  - preserved-region-review
  - update-and-recovery-validation
